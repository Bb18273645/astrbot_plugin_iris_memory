name: fork-guard

on:
  push:
    branches: [master, my-fixes]
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Check fork-only features
        run: python -m pytest tests/fork -q
